/* v0.4 — fullscreen-first waiter room plans and drag-and-drop manager floor editor */
.app.till-floor{display:block;min-height:100dvh}
.till-floor>.sidebar{display:none}

.till-link.active{background:#193244;color:white;box-shadow:0 2px 5px #17304425}
.till-link:hover{background:#e1e9ec}.till-link.active:hover{background:#193244}
.till-floor .content{max-width:none;margin:0;padding:18px clamp(14px,2vw,38px) 14px}
.till-floor~.bottomnav{display:none}
.till-floor .mobile-workspaces{display:none!important}
.till-screen{position:relative}
.floor-titlebar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.floor-titlebar h2{font-size:clamp(23px,2vw,33px);letter-spacing:-.6px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.floor-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#b27736;margin-bottom:3px}

.floor-toolbar{display:flex;gap:9px}

.floor-tabbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.room-tabs{gap:8px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;padding:2px}
.room-tab{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px 22px;min-height:52px;font-size:15px;white-space:nowrap;border-radius:12px}
.room-count{font-size:11px;background:#eef1f3;padding:4px 8px;border-radius:999px;color:#6b7986}
.room-tab.on .room-count{background:#476170;color:#fff}
.floor-legend{margin:0;gap:16px;font-size:12px;white-space:nowrap}
.floor-board{position:relative;isolation:isolate;min-height:clamp(470px,calc(100dvh - 270px),1200px);border:2px solid #ccd7dc;border-radius:18px;overflow:hidden;background-color:#f9fbfb;background-image:radial-gradient(#cbd8d855 1px,transparent 1px),linear-gradient(130deg,#e6f0ef66,transparent 45%);background-size:22px 22px,100% 100%;box-shadow:inset 0 0 0 9px #fff,0 4px 18px #24323a0d}
.floor-board:before{content:"";pointer-events:none;position:absolute;top:7.5%;bottom:7.5%;left:2%;width:7px;border-radius:4px;background:repeating-linear-gradient(180deg,#b6cdd5 0 34px,transparent 34px 68px);opacity:.65}
.floor-board-top{position:absolute;top:17px;left:24px;right:24px;display:flex;justify-content:space-between;gap:16px;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1.3px;color:#9aa9b2;pointer-events:none}
.floor-wall-label{color:#b0bdc5}
.floor-entry{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:1px solid #d4dfe5;border-bottom:0;background:#fff;border-radius:10px 10px 0 0;padding:8px 25px;color:#91a0ad;font-size:10px;font-weight:800;letter-spacing:1.1px;pointer-events:none}

.floor-piece.ready{background:#dff6eb;border-color:#61ac8d;color:#27634f}
.floor-piece-num{font-size:clamp(14px,1.2vw,20px);font-weight:850;line-height:1.1;text-align:center;overflow-wrap:anywhere}

.floor-drawer-backdrop{position:fixed;inset:0;background:#07182640;z-index:60}
.floor-drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(450px,100vw);border-radius:18px 0 0 18px;padding:22px;overflow-y:auto;box-shadow:-10px 0 44px #10233036;display:block}

function buildJobs(table,lines){const grouped=new Map();lines.forEach(l=>{const sid=routedStation(l);if(!grouped.has(sid))grouped.set(sid,[]);grouped.get(sid).push({id:l.id,name:l.productName,qty:l.qty,course:l.course,notes:l.notes,options:l.options,seat:l.seat||0})});for(const [stationId,items] of grouped){state.printJobs.push({id:id(),table:table.name,tableId:table.id,stationId,at:new Date().toISOString(),status:'queued',items})}}

const ui={workspace:'service',stationFilter:'all',page:'floor',zone:'Main room',floorInspectorOpen:false,designerSelected:'m1',category:'Mains',subcategory:'all',seat:0,menuSearch:'',tableId:'m2',modal:null,orderDraft:null,productEdit:null,inventoryEdit:null,importPreview:null,toast:'',extraPaymentMethod:'cash'};

function save(){localEdits++;if(backend==='connected')queueServerSave(structuredClone(state));else if(backend==='local'||backend==='checking'){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Your browser storage is full. Try using smaller product photos.')};}render();}
function flash(text){ui.toast=text;render();clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{ui.toast='';document.querySelector('.toast')?.remove()},3800)}
function productFor(line){return state.products.find(p=>p.id===line.productId)||{name:'Archived product',price:0,icon:'•'}}
const itemUnit=line=>Number(line.basePrice??productFor(line).price)+(line.options||[]).reduce((sum,x)=>sum+Number(x.price||0),0);
const itemTotal=line=>Number((itemUnit(line)*line.qty).toFixed(2));
const tableTotal=t=>Number((t.items||[]).reduce((sum,l)=>sum+itemTotal(l),0).toFixed(2));
const busy=t=>t.covers>0;
const tableStatus=t=>!busy(t)?'free':t.items.length&&t.items.every(x=>x.ready)?'ready':'busy';
const totalPaid=()=>state.ledger.reduce((s,l)=>s+l.total,0);
const numCovers=()=>state.ledger.reduce((s,l)=>s+l.covers,0);

function csvRows(text){
 const data=String(text||'').replace(/^\ufeff/,'');
 const line=data.split(/\r?\n/,1)[0]||'';
 const sep=(line.match(/;/g)||[]).length>(line.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<data.length;i++){
  const c=data[i];
  if(c==='"'){if(quoted&&data[i+1]==='"'){field+='"';i++}else quoted=!quoted}
  else if(c===sep&&!quoted){row.push(field.trim());field=''}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&data[i+1]==='\n')i++;row.push(field.trim());if(row.some(Boolean))rows.push(row);row=[];field=''}
  else field+=c;
 }
 if(quoted)throw Error('Unclosed quotation mark in CSV.');
 row.push(field.trim());if(row.some(Boolean))rows.push(row);
 return rows;
}
function buildImport(text){
 const rows=csvRows(text),headers=(rows.shift()||[]).map(h=>h.toLowerCase().trim());
 const required=['name','price','cost','category'];
 const missing=required.filter(h=>!headers.includes(h));
 if(missing.length)throw Error('Missing CSV columns: '+missing.join(', '));
 if(rows.length>500)throw Error('Maximum 500 products per import.');
 const records=[],errors=[],seen=new Set(state.products.map(p=>(p.name+'|'+p.category).toLowerCase()));let duplicates=0;
 for(const [i,row] of rows.entries()){
  const val=k=>row[headers.indexOf(k)]?.trim()||'';
  const name=val('name'),price=Number(val('price').replace(',','.')),cost=Number(val('cost').replace(',','.'));
  const category=val('category'),family=val('family')||'Food',subcategory=val('subcategory')||category;
  const course=val('course')||({'Starters':'Starter','Mains':'Main','Desserts':'Dessert','Drinks':'Drinks'}[category]||'Main');
  const stationId=val('station')||state.routes[category]||'hot';
  const invalid=!name||name.length>80||!category||category.length>40||!val('price')||!val('cost')||!Number.isFinite(price)||price<0||price>100000||!Number.isFinite(cost)||cost<0||cost>100000||!state.stations.some(x=>x.id===stationId)||!['Starter','Main','Dessert','Drinks'].includes(course)||!['Food','Beverages','Other'].includes(family);
  if(invalid){errors.push('Row '+(i+2)+': check name, prices, category, family, course or station.');continue}
  const key=(name+'|'+category).toLowerCase();if(seen.has(key)){duplicates++;continue}seen.add(key);
  records.push({id:id(),name,price:Math.round(price*100)/100,cost:Math.round(cost*100)/100,category,family,subcategory,course,stationId,icon:val('icon')||'🍽',options:[]});
 }
 return {records,errors,duplicates};
}

else if(m==='reset'){body=`<h2>Reset sample restaurant?</h2><p>All changes to tables, products, photos, sales and stock in this browser will be replaced by the original sample data.</p><div class="buttonrow">${modalBtn('Cancel','close-modal')}${modalBtn('Reset demo','confirm-reset','warn')}</div>`}
else if(m==='closeCash'){body=`<h2>Close shift</h2><p>Demo only. After closing this shift you can open a new one.</p><div class="totalline"><span>Expected</span><strong>${money(shiftExpected())}</strong></div><div class="totalline"><span>Counted</span><strong>${money(ui.closingActual)}</strong></div><div class="totalline"><span>Difference</span><strong>${money(ui.closingActual-shiftExpected())}</strong></div><div class="buttonrow">${modalBtn('Back','close-modal')}${modalBtn('Confirm close','confirm-cash-close','gold')}</div>`}
return `<div class="overlay" data-overlay="1"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`}
function getSelectedOptions(d,p){return (p.options||[]).flatMap((g,i)=>(d.selected[i]||[]).map(j=>({group:g.name,label:g.values[j]?.label,price:Number(g.values[j]?.price||0)})).filter(x=>x.label))}
function openProduct(productId){const p=state.products.find(x=>x.id===productId),t=state.tables.find(x=>x.id===ui.tableId);if(!p||!t||!busy(t))return flash('Seat guests at a table first.');ui.orderDraft={productId,qty:1,course:p.course,notes:'',seat:ui.seat<=t.covers?ui.seat:0,selected:{}};p.options.forEach((g,i)=>{if(g.mode==='required')ui.orderDraft.selected[i]=[0]});ui.modal='item';render()}
function setOpt(i,j){const p=state.products.find(x=>x.id===ui.orderDraft.productId),g=p.options[i],selected=ui.orderDraft.selected[i]||[];ui.orderDraft.selected[i]=g.mode==='multi'?(selected.includes(j)?selected.filter(x=>x!==j):[...selected,j]):[j];const q=document.getElementById('item-qty'),n=document.getElementById('item-notes'),c=document.getElementById('item-course'),seat=document.getElementById('item-seat');ui.orderDraft.qty=Number(q.value)||1;ui.orderDraft.notes=n.value;ui.orderDraft.course=c.value;ui.orderDraft.seat=Number(seat?.value||0);render()}
function sendKitchen(onlyHeld=false){
 const t=state.tables.find(x=>x.id===ui.tableId);
 if(!t||!busy(t))return flash('No active table.');
 const pending=t.items.filter(x=>!x.sent&&(onlyHeld?x.held:!x.held));
 if(!pending.length)return flash(onlyHeld?'No held items to fire.':'No unheld items waiting to be sent.');
 pending.forEach(x=>{x.held=false;x.sent=true;x.ready=false;x.at=Date.now();x.stationId=routedStation(x)});
 if(backend!=='connected')buildJobs(t,pending);
 save();flash(`${pending.length} item(s) ${onlyHeld?'fired':'sent'} to preparation stations (demo).`);
}
function pay(){const t=state.tables.find(x=>x.id===ui.tableId);if(!t||!busy(t)||!t.items.length)return flash('Add items before taking payment.');ui.extraPaymentMethod='cash';ui.modal='payment';render()}
function finishPay(){const t=state.tables.find(x=>x.id===ui.tableId);if(!t||!busy(t)||!t.items.length)return;const receipt={id:id(),at:new Date().toISOString(),total:tableTotal(t),method:ui.extraPaymentMethod,covers:t.covers,items:t.items.map(l=>({name:l.productName||productFor(l).name,quantity:l.qty,total:itemTotal(l),notes:l.notes,modifiers:l.options}))};state.ledger.push(receipt);t.items=[];t.covers=0;t.openedAt=null;ui.modal=null;save();flash(`Demo receipt ${receipt.id.slice(-7)} paid · ${money(receipt.total)}.`)}
function readNum(el){return Number(document.getElementById(el)?.value)}
function doAction(act){const t=state.tables.find(x=>x.id===ui.tableId);switch(act){case'close-modal':ui.modal=null;render();return;case'goto-order':ui.page='order';render();return;case'goto-floor':ui.page='floor';ui.floorInspectorOpen=false;render();return;case'close-floor-inspector':ui.floorInspectorOpen=false;render();return;case'fullscreen':if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>flash('Could not exit full screen.'))}else{document.documentElement.requestFullscreen?.().catch(()=>flash('Full screen is not supported here.'))}return;case'delete-designer-table':{const dt=state.tables.find(x=>x.id===ui.designerSelected);if(!dt||busy(dt))return flash('Only empty tables can be deleted.');state.tables=state.tables.filter(x=>x.id!==dt.id);ui.designerSelected=state.tables.find(x=>x.zone===ui.zone)?.id||null;save();flash(dt.name+' deleted.');return}case'seat':ui.modal='seat';render();return;case'edit-covers':ui.modal='covers';render();return;case'send-kitchen':sendKitchen();return;case'fire-held':sendKitchen(true);return;case'pay-open':pay();return;case'finish-pay':finishPay();return;case'move-table':if(!t||!busy(t))return;ui.modal='move';render();return;case'confirm-move':{const dest=state.tables.find(x=>x.id===document.getElementById('move-target')?.value);if(!dest||busy(dest))return flash('Choose an empty table.');dest.covers=t.covers;dest.items=t.items;dest.openedAt=t.openedAt;t.covers=0;t.items=[];t.openedAt=null;ui.tableId=dest.id;ui.zone=dest.zone;ui.modal=null;save();flash(`Moved check to ${dest.name}`);return}case'download-csv-template':downloadCsvTemplate();return;case'cancel-csv-import':ui.importPreview=null;render();return;case'apply-csv-import':{const preview=ui.importPreview;if(!preview||preview.errors.length||!preview.records.length)return flash('Review CSV import issues first.');for(const p of preview.records){if(!state.categories.includes(p.category)){state.categories.push(p.category);state.routes[p.category]=p.stationId}state.products.push(p)}const total=preview.records.length;ui.importPreview=null;save();flash(total+' menu products imported.');return;}case'new-product':ui.productEdit=null;render();return;case'add-category':{const val=document.getElementById('category-input')?.value.trim();if(!val)return;if(state.categories.some(c=>c.toLowerCase()===val.toLowerCase()))return flash('Category already exists.');state.categories.push(val);save();flash('New menu category added.');return}case'adjust-stock':{const s=state.inventory.find(x=>x.id===document.getElementById('stock-id')?.value),val=readNum('stock-count'),reason=document.getElementById('stock-reason')?.value;if(!s||!Number.isFinite(val)||val<0||document.getElementById('stock-count')?.value==='')return flash('Enter a valid stock count.');state.stockLog.unshift({at:new Date().toISOString(),name:s.name,before:s.qty,after:val,reason});s.qty=val;save();flash('Stock count recorded.');return}case'cash-move':{const inp=document.getElementById('cash-movement'),amt=Number(inp?.value),reason=document.getElementById('cash-reason')?.value.trim();if(!state.shift.open||!inp?.value||!Number.isFinite(amt)||amt===0||!reason)return flash('Enter a non-zero cash amount and reason.');state.shift.movements.push({at:new Date().toISOString(),amount:amt,reason});save();flash('Cash movement recorded.');return}case'cash-preview':case'cash-close':{const inp=document.getElementById('cash-actual'),n=Number(inp?.value);if(!inp?.value||!Number.isFinite(n)||n<0)return flash('Enter actual counted cash.');ui.closingActual=n;if(act==='cash-preview'){return flash(`Cash difference: ${money(n-shiftExpected())}.`)}ui.modal='closeCash';render();return}case'confirm-cash-close':{state.shift.lastClose={at:new Date().toISOString(),expected:shiftExpected(),actual:ui.closingActual,variance:Number((ui.closingActual-shiftExpected()).toFixed(2))};state.shift.open=false;ui.modal=null;save();flash('Demo shift closed.');return}case'cash-open':{const i=document.getElementById('cash-newfloat');const n=Number(i?.value);if(i?.value===''||!Number.isFinite(n)||n<0)return flash('Enter a valid opening float.');state.shift={open:true,opening:n,startedAt:new Date().toISOString(),movements:[],lastClose:state.shift.lastClose};save();flash('New demo shift opened.');return}case'rename':{const name=document.getElementById('restaurant-name')?.value.trim();if(!name)return flash('Enter a restaurant name.');state.restaurant=name;save();flash('Restaurant name updated.');return}case'reset':ui.modal='reset';render();return;case'confirm-reset':state=normalize(defaultState());ui.page='floor';ui.zone='Main room';ui.tableId='m2';ui.floorInspectorOpen=false;ui.modal=null;ui.productEdit=null;ui.seat=0;ui.menuSearch='';save();flash('Demo restored to sample data.');return;case'add-item':{const d=ui.orderDraft,p=state.products.find(x=>x.id===d.productId);d.qty=readNum('item-qty');d.notes=document.getElementById('item-notes')?.value.trim().slice(0,250)||'';d.course=document.getElementById('item-course')?.value||p.course;d.seat=Number(document.getElementById('item-seat')?.value||0);if(!Number.isInteger(d.seat)||d.seat<0||d.seat>t.covers)return flash('Choose a valid guest seat.');if(!Number.isInteger(d.qty)||d.qty<1||d.qty>50)return flash('Choose quantity 1–50.');for(let i=0;i<(p.options||[]).length;i++){if(p.options[i].mode==='required'&&!(d.selected[i]||[]).length)return flash(`Select ${p.options[i].name}.`)}const l={id:id(),productId:p.id,productName:p.name,basePrice:p.price,qty:d.qty,notes:d.notes,course:d.course,options:getSelectedOptions(d,p),stationId:p.stationId||state.routes[p.category],seat:d.seat,held:false,sent:false,ready:false,at:Date.now()};t.items.push(l);ui.modal=null;save();flash(`${p.name} added to ${t.name}.`);return}default:if(act.startsWith('ready-all:')){const tid=act.split(':')[1],table=state.tables.find(x=>x.id===tid);table?.items.filter(x=>x.sent).forEach(x=>x.ready=true);save();flash('Kitchen order marked ready.');return}}}
function handleClick(e){const n=e.target.closest('[data-workspace],[data-stationfilter],[data-nav],[data-zone],[data-table],[data-open-table],[data-category],[data-subcategory],[data-product],[data-action],[data-option],[data-paymethod],[data-remove-line],[data-hold-line],[data-seat-line],[data-seat],[data-ready],[data-edit-product],[data-stock],[data-designer-table]');if(!n){if(e.target?.dataset?.overlay){ui.modal=null;render()}return}if(n.dataset.workspace){ui.workspace=n.dataset.workspace;ui.page=ui.workspace==='manager'?'designer':ui.workspace==='kitchen'?'kitchen':'floor';ui.floorInspectorOpen=false;render();return}if(n.dataset.stationfilter){ui.stationFilter=n.dataset.stationfilter;render();return}if(n.dataset.nav){ui.page=n.dataset.nav;ui.floorInspectorOpen=false;render();return}if(n.dataset.zone){ui.zone=n.dataset.zone;ui.floorInspectorOpen=false;const first=state.tables.find(x=>x.zone===ui.zone);if(first){ui.tableId=first.id;ui.designerSelected=first.id}render();return}if(n.dataset.table){ui.tableId=n.dataset.table;ui.seat=0;ui.floorInspectorOpen=true;render();return}if(n.dataset.openTable){ui.tableId=n.dataset.openTable;ui.seat=0;render();return}if(n.dataset.designerTable){ui.designerSelected=n.dataset.designerTable;render();return}if(n.dataset.category){ui.category=n.dataset.category;ui.subcategory='all';ui.menuSearch='';render();return}if(n.dataset.subcategory){ui.subcategory=n.dataset.subcategory;render();return}if(n.dataset.product){openProduct(n.dataset.product);return}if(n.dataset.option){const [i,j]=n.dataset.option.split(':').map(Number);setOpt(i,j);return}if(n.dataset.seat!==undefined){ui.seat=Number(n.dataset.seat);render();return}
if(n.dataset.holdLine){const t=state.tables.find(x=>x.id===ui.tableId),l=t?.items.find(x=>x.id===n.dataset.holdLine);if(!l||l.sent)return; l.held=!l.held;save();flash(l.held?'Item held; it will not be sent until fired.':'Item released; ready to send.');return}
if(n.dataset.seatLine){const t=state.tables.find(x=>x.id===ui.tableId),l=t?.items.find(x=>x.id===n.dataset.seatLine);if(!l||l.sent)return;l.seat=(l.seat||0)>=t.covers?0:l.seat+1;save();return}
if(n.dataset.paymethod){ui.extraPaymentMethod=n.dataset.paymethod;render();return}if(n.dataset.editProduct){ui.productEdit=n.dataset.editProduct;render();return}if(n.dataset.removeLine){const t=state.tables.find(x=>x.id===ui.tableId),l=t?.items.find(x=>x.id===n.dataset.removeLine);if(l?.sent)return flash('Sent items cannot be removed in this prototype.');if(t){t.items=t.items.filter(x=>x.id!==n.dataset.removeLine);save();flash('Unsent item removed.')}return}if(n.dataset.ready){const [tid,lid]=n.dataset.ready.split(':');const l=state.tables.find(x=>x.id===tid)?.items.find(x=>x.id===lid);if(l){l.ready=true;save();flash('Item marked ready.')}return}if(n.dataset.stock){ui.inventoryEdit=n.dataset.stock;render();return}if(n.dataset.action){doAction(n.dataset.action);return}}
async function imageData(file){if(!file)return null;if(file.size>8e6)throw Error('Use an image smaller than 8 MB.');const bitmap=await createImageBitmap(file);const scale=Math.min(1,420/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.76)}
async function handleSubmit(e){const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(form.dataset.form==='floor-add'){
 const fd=new FormData(form),name=String(fd.get('tableName')||'').trim(),zone=String(fd.get('zone')||'').trim();
 if(!name||!zone||name.length>40||zone.length>40||state.tables.length>=250)return flash('Enter a valid name and area (maximum 250 tables).');
 if(state.tables.some(t=>t.name.toLowerCase()===name.toLowerCase()))return flash('A table with this name already exists.');
 const [x,y]=placeAt(zone,state.tables.filter(t=>t.zone===zone).length);const table={id:'tbl-'+id(),name,zone,x,y,shape:'rect',seats:4,covers:0,openedAt:null,items:[]};if(!state.areas.includes(zone))state.areas.push(zone);state.tables.push(table);ui.tableId=table.id;ui.zone=zone;save();flash(name+' added to '+zone+'.');return;
}if(form.dataset.form==='floor-edit'){
 const fd=new FormData(form),t=state.tables.find(x=>x.id===String(fd.get('tableId'))),name=String(fd.get('tableName')||'').trim(),zone=String(fd.get('zone')||'').trim();
 if(!t||!name||!zone||name.length>40||zone.length>40)return flash('Choose a table, valid name and area.');
 if(state.tables.some(x=>x.id!==t.id&&x.name.toLowerCase()===name.toLowerCase()))return flash('A table with this name already exists.');
 t.name=name;t.zone=zone;if(!state.areas.includes(zone))state.areas.push(zone);ui.tableId=t.id;ui.zone=zone;save();flash('Table plan updated.');return;
 }if(form.dataset.form==='designer-add'){
 const fd=new FormData(form),name=String(fd.get('tableName')||'').trim(),seats=Number(fd.get('seats')),shape=String(fd.get('shape'));
 if(!name||name.length>40||!Number.isInteger(seats)||seats<1||seats>20||!['rect','round','square'].includes(shape)||state.tables.length>=250)return flash('Enter a table name, shape and seating capacity (1–20).');
 if(state.tables.some(t=>t.name.toLowerCase()===name.toLowerCase()))return flash('This table number or name already exists.');
 const [x,y]=placeAt(ui.zone,state.tables.filter(t=>t.zone===ui.zone).length);const table={id:'tbl-'+id(),name,zone:ui.zone,x,y,shape,seats,covers:0,openedAt:null,items:[]};
 state.tables.push(table);ui.designerSelected=table.id;ui.tableId=table.id;save();flash(name+' added. Drag it to position it.');return;
 }if(form.dataset.form==='area-add'){
 const name=String(new FormData(form).get('name')||'').trim();if(!name||name.length>40)return flash('Enter an area name under 40 characters.');
 if(state.areas.some(z=>z.toLowerCase()===name.toLowerCase()))return flash('That area already exists.');
 state.areas.push(name);ui.zone=name;ui.designerSelected=null;save();flash(name+' created. Add tables to this area.');return;
 }if(form.dataset.form==='designer-table'){
 const fd=new FormData(form),t=state.tables.find(x=>x.id===String(fd.get('tableId'))),name=String(fd.get('tableName')||'').trim(),zone=String(fd.get('zone')),shape=String(fd.get('shape')),seats=Number(fd.get('seats'));
 if(!t||!name||name.length>40||!state.areas.includes(zone)||!['rect','round','square'].includes(shape)||!Number.isInteger(seats)||seats<1||seats>20)return flash('Check the table name, room, shape and seats.');
 if(state.tables.some(x=>x.id!==t.id&&x.name.toLowerCase()===name.toLowerCase()))return flash('This table number or name already exists.');
 if(t.zone!==zone){const [x,y]=placeAt(zone,state.tables.filter(x=>x.zone===zone).length);t.x=x;t.y=y}
 Object.assign(t,{name,zone,shape,seats});ui.zone=zone;ui.designerSelected=t.id;save();flash('Table details saved.');return;
 }if(form.dataset.form==='covers'){const covers=Number(new FormData(form).get('covers')),t=state.tables.find(x=>x.id===ui.tableId);if(!Number.isInteger(covers)||covers<1||covers>50)return flash('Covers must be between 1 and 50.');t.covers=covers;if(!t.openedAt)t.openedAt=new Date().toISOString();ui.modal=null;save();flash(`${t.name} now has ${covers} covers.`);return}if(form.dataset.form==='routing'){const fd=new FormData(form);for(const cat of state.categories){const st=String(fd.get('route:'+cat)||'');if(!state.stations.some(x=>x.id===st))return flash('Invalid routing station');state.routes[cat]=st}save();flash('Default routing saved. Update product station overrides in Menu editor if needed.');return}if(form.dataset.form==='product'){const fd=new FormData(form),name=String(fd.get('name')||'').trim(),price=Number(fd.get('price')),category=String(fd.get('category')),course=String(fd.get('course')),icon=String(fd.get('icon')).trim()||'🍽';if(!name||!Number.isFinite(price)||price<0||!state.categories.includes(category))return flash('Check product name, price and category.');let options;try{options=parseOptions(String(fd.get('rules')||''))}catch(err){return flash(err.message)}let image=null;const file=fd.get('image');if(file&&file.size){try{image=await imageData(file)}catch(err){return flash(err.message)}}const cost=Number(fd.get('cost')),stationId=String(fd.get('stationId')),family=String(fd.get('family')),subcategory=String(fd.get('subcategory')||category).trim();if(!Number.isFinite(cost)||cost<0||!state.stations.some(x=>x.id===stationId))return flash('Check cost and routing station.');const posCol=String(fd.get('posColor')||'slate'),priority=Number(fd.get('posPriority'));if(!POS_COLORS.includes(posCol)||!Number.isInteger(priority)||priority<0||priority>99)return flash('Choose a valid POS colour and display priority.');const record={name,price,cost,category,course,icon,options,stationId,family,subcategory,posColor:posCol,posPriority:priority};const existing=state.products.find(p=>p.id===fd.get('id'));if(existing){Object.assign(existing,record);if(image)existing.image=image}else state.products.push({id:id(),...record,...(image?{image}:{})});ui.productEdit=null;save();flash('Menu item saved successfully.');return}}

 }

let floorDrag=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-designer-table]');if(!el||ui.page!=='designer'||e.button>0)return;
 const table=state.tables.find(x=>x.id===el.dataset.designerTable),board=el.closest('.floor-edit-board');if(!table||!board)return;
 e.preventDefault();ui.designerSelected=table.id;
 document.querySelectorAll('.floor-edit-board .floor-piece').forEach(n=>n.classList.toggle('chosen',n===el));
 floorDrag={el,board,table,id:e.pointerId,moved:false,startX:e.clientX,startY:e.clientY,originalX:table.x,originalY:table.y};
 el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
 const d=floorDrag;if(!d||d.id!==e.pointerId)return;
 const rect=d.board.getBoundingClientRect();if(rect.width<1||rect.height<1)return;
 const x=bounded(((e.clientX-rect.left)/rect.width)*100,9,91),y=bounded(((e.clientY-rect.top)/rect.height)*100,12,88);
 if(Math.abs(e.clientX-d.startX)+Math.abs(e.clientY-d.startY)>5)d.moved=true;
 if(d.moved){d.el.style.left=x.toFixed(1)+'%';d.el.style.top=y.toFixed(1)+'%';}
});
function finishFloorDrag(e){const d=floorDrag;if(!d||d.id!==e.pointerId)return;floorDrag=null;
 if(d.moved){d.table.x=Number.parseFloat(d.el.style.left);d.table.y=Number.parseFloat(d.el.style.top);save();}
 else render();
}
document.addEventListener('pointerup',finishFloorDrag);
document.addEventListener('pointercancel',e=>{if(floorDrag&&e.pointerId===floorDrag.id){floorDrag=null;render()}});
document.addEventListener('keydown',e=>{
 const el=e.target.closest?.('[data-designer-table]');if(!el||ui.page!=='designer'||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
 e.preventDefault();const t=state.tables.find(x=>x.id===el.dataset.designerTable);if(!t)return;
 const amt=e.shiftKey?5:1;if(e.key==='ArrowLeft')t.x=bounded(t.x-amt,9,91);if(e.key==='ArrowRight')t.x=bounded(t.x+amt,9,91);if(e.key==='ArrowUp')t.y=bounded(t.y-amt,12,88);if(e.key==='ArrowDown')t.y=bounded(t.y+amt,12,88);
 ui.designerSelected=t.id;save();document.querySelector(`[data-designer-table="${CSS.escape(t.id)}"]`)?.focus();
});
